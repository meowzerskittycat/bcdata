name: Sync

on:
  schedule:
    - cron: "17 4 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Make sure the release exists
        run: gh release view data >/dev/null 2>&1 || gh release create data --title "Game data" --notes "Game data archives used by the BCSFE save editor. Updated daily from upstream."
      - name: Copy new versions
        run: python sync.py
      - name: Commit metadata.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metadata.json
          git diff --cached --quiet || { git commit -m "Update metadata.json" && git push; }
